name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: |
          sudo apt update -y && sudo apt install libkrb5-dev build-essential python3-dev -y
          make setup

      - parallel:
          - name: Lint
            run: make lint

          - name: Format
            run: make format-check

          - name: Typecheck
            run: make typecheck

          - name: Radon
            run: make radon

          - name: Test
            run: make test
